syntax = "proto3";

package prompt2api.erc4626.v1;

message Deposit {
  string event_id = 1;
  string chain_id = 2;
  string vault_address = 3;
  string sender_address = 4;
  string owner_address = 5;
  string assets_raw = 6;
  string shares_raw = 7;
  uint64 block_number = 8;
  string block_time = 9;
  string transaction_hash = 10;
  uint32 log_index = 11;
}

message Withdraw {
  string event_id = 1;
  string chain_id = 2;
  string vault_address = 3;
  string sender_address = 4;
  string receiver_address = 5;
  string owner_address = 6;
  string assets_raw = 7;
  string shares_raw = 8;
  uint64 block_number = 9;
  string block_time = 10;
  string transaction_hash = 11;
  uint32 log_index = 12;
}

message VaultEvents {
  repeated Deposit deposits = 1;
  repeated Withdraw withdrawals = 2;
}
